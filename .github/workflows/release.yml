name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ensure glib-compile-schemas is available
        run: |
          if ! command -v glib-compile-schemas >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libglib2.0-bin
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: make check
      - run: make pack pack-ego

      - name: Verify package contents
        run: |
          for archive in notman.zip notman@kbgjtn.github.io.shell-extension.zip; do
            LIST="$(unzip -Z1 "$archive")"
            for required in metadata.json extension.js prefs.js stylesheet.css LICENSE schemas/org.gnome.shell.extensions.notman.gschema.xml schemas/gschemas.compiled; do
              echo "$LIST" | grep -qx "$required" || { echo "Missing $required in $archive"; exit 1; }
            done
            if echo "$LIST" | grep -qE '(^node_modules/|\.ts$)'; then
              echo "Unexpected source or node_modules files in $archive"
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            notman.zip \
            notman@kbgjtn.github.io.shell-extension.zip \
            --title "Notman ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publish to extensions.gnome.org (optional)
        if: ${{ vars.EGO_PUBLISH == 'true' }}
        uses: murar8/gnome-extensions-action@v0.1.1
        with:
          source-dir: dist
          username: ${{ secrets.GNOME_USERNAME }}
          password: ${{ secrets.GNOME_PASSWORD }}
          accept-tos: true
          force: true
