name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ensure glib-compile-schemas is available
        run: |
          if ! command -v glib-compile-schemas >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libglib2.0-bin
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build, typecheck, test, lint and validate schema
        run: make check

      - name: Verify committed benchmark report
        run: |
          make report
          git diff --exit-code -- results/report.md

      - name: Package the extension
        run: make pack

      - name: Verify package contents
        run: |
          LIST="$(unzip -Z1 notman.zip)"
          for required in metadata.json extension.js prefs.js schemas/gschemas.compiled; do
            echo "$LIST" | grep -qx "$required" || { echo "Missing $required in notman.zip"; exit 1; }
          done
          if echo "$LIST" | grep -qE '(^node_modules/|\.ts$)'; then
            echo "Unexpected source or node_modules files in notman.zip"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: notman-extension
          path: notman.zip
          if-no-files-found: error

  compat:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome: "46"
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends gjs libglib2.0-bin gir1.2-gdkpixbuf-2.0
          - gnome: "47"
            image: fedora:41
            install: dnf install -y gjs glib2 gdk-pixbuf2
          - gnome: "48"
            image: fedora:42
            install: dnf install -y gjs glib2 gdk-pixbuf2
          - gnome: "49"
            image: fedora:43
            install: dnf install -y gjs glib2 gdk-pixbuf2
          - gnome: "50"
            image: fedora:44
            install: dnf install -y gjs glib2 gdk-pixbuf2
          - gnome: "51"
            image: fedora:45
            install: dnf install -y gjs glib2 gdk-pixbuf2
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GJS and GLib tools for GNOME ${{ matrix.gnome }}
        run: ${{ matrix.install }}

      - name: Validate GSettings schema against GNOME ${{ matrix.gnome }} GLib
        run: glib-compile-schemas --strict schemas

      - name: Verify metadata and GI bindings on GNOME ${{ matrix.gnome }} GJS
        run: |
          cat <<'EOF' > /tmp/compat-check.mjs
          import GdkPixbuf from "gi://GdkPixbuf";
          import Gio from "gi://Gio";
          import GLib from "gi://GLib";
          import System from "system";

          const [ok, bytes] = Gio.File.new_for_path("metadata.json").load_contents(null);
          if (!ok) throw new Error("Failed to read metadata.json");
          const metadata = JSON.parse(new TextDecoder("utf-8").decode(bytes));
          const target = "${{ matrix.gnome }}";
          if (!Array.isArray(metadata["shell-version"]) || !metadata["shell-version"].includes(target)) {
            throw new Error(`metadata.json missing shell-version ${target}`);
          }
          if (typeof GdkPixbuf.Pixbuf.new_from_stream_at_scale_async !== "function") {
            throw new Error("GdkPixbuf.Pixbuf.new_from_stream_at_scale_async unavailable");
          }
          print(`GNOME ${target} compat OK (GJS ${System.version}, GLib ${GLib.MAJOR_VERSION}.${GLib.MINOR_VERSION})`);
          EOF
          gjs -m /tmp/compat-check.mjs
